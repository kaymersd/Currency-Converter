<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Dev Club - Money Convert</title>
</head>
<body>
    <div class="branco">            
        
        <img class="logo" src="./assets/logo (2).gif" alt="">

        <main>
                <label>
                    Converter <b>de</b>
                    <select>
                        <option>R$ Real brasileiro</option>
                    </select>
                </label>        
                
                <label>
                    Converter <b>para</b>
                    <select class="currency-select">
                        <option value="dolar">Dólar dos Estados Unidos (USD)</option>
                        <option value="euro">Euro (EUR)</option>
                        <option value="libra">Libra de Gibraltar (GIP)</option>
                    </select>        
                </label>

                <label>
                    Valor
                    <input class="input-currency" placeholder="R$ 10.000,00">
                </label>

                <button class="convert-button">Converter</button>

            <section>
                <div class="currency-box">
                    <img src="./assets/brasil 2.png" alt="">
                    <p class="currency">Real</p>
                    <p class="currency-value-to-convert">R$ 0.00</p>
                </div>
                
                <img class="arrow-img" src="./assets/Vector (1).png"  alt="">

                <div class="currency-box">
                    <img class="currency-img" src="./assets/estados-unidos (1) 1.png" alt="">
                    <p class="currency" id="currency-name">Dólar Americano</p>
                    <p class="currency-value">R$ 0.00</p>
                </div>
            </section>        
        </main>

    </div>
</body>
    <script src="./scripts.js"></script>
</html>
